services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexaquill
      POSTGRES_PASSWORD: nexaquill
      POSTGRES_DB: nexaquill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nexaquill:nexaquill@postgres:5432/nexaquill
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  worker:
    build: ./backend
    command: ["uv", "run", "python", "-m", "nexaquill_api.worker"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nexaquill:nexaquill@postgres:5432/nexaquill
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

